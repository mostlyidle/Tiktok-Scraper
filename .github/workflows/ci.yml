name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy tiktok_scraper/

      - name: Test
        run: pytest -q

      - name: Verify wheel contents
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/wheels .
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("/tmp/wheels").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          assert any(name.startswith("tiktok_scraper/") for name in names)
          assert not any(name.startswith("tests/") for name in names)
          PY
