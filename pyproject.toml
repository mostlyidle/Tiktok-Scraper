[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-scraper"
version = "0.1.0"
description = "CLI tool to scrape all videos from a TikTok creator's profile."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "playwright>=1.40.0",
    "yt-dlp>=2026.08.19",
    "curl-cffi>=0.7.3",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[project.scripts]
tiktok-scraper = "tiktok_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit real TikTok (deselect with '-m \"not integration\"')",
]
addopts = "--cov=tiktok_scraper --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["tiktok_scraper"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "yt_dlp.*",
    "playwright.*",
]
ignore_missing_imports = true
